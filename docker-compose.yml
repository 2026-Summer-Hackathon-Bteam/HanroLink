services:
  postgres:
    image: postgres:17.7
    container_name: hanrolink-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build: ./hanrolink-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: "dev,cognito"
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC"

    env_file:
      - ./hanrolink-backend/.env

    container_name: hanrolink-backend

    ports:
      - "${BACKEND_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./hanrolink-frontend
    container_name: hanrolink-frontend

    ports:
      - "${FRONTEND_PORT}:5173"

    volumes:
      - ./hanrolink-frontend:/app
      - /app/node_modules

    depends_on:
      - backend

volumes:
  postgres_data:
