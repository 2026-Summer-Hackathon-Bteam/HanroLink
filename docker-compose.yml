services:
  postgres:
    image: postgres:17.7
    container_name: hanrolink-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: hanrolink
      POSTGRES_USER: hanrolink
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
      build: ./hanrolink-backend

      container_name: hanrolink-backend

      ports:
        - "8080:8080"

      depends_on:
        postgres:
          condition: service_healthy

volumes:
  postgres_data: