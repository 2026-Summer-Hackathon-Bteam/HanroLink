spring:
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    org.springframework.security: INFO

server:
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

app:
  security:
    cors:
      allowed-origin: ${CORS_ALLOWED_ORIGIN}
